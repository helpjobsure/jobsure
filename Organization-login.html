<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Jobsure</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #004aad, #00b4d8);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      padding: 40px;
      width: 360px;
      text-align: center;
      color: #fff;
      animation: fadeIn 0.8s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    h2 {
      margin-bottom: 25px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }
    input[type="email"],
    input[type="password"] {
      background: rgba(255, 255, 255, 0.85);
      color: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0077ff;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }
    button:hover {
      background: #005fcc;
    }
    .showpass {
      text-align: left;
      font-size: 13px;
      color: #fff;
      margin: -5px 0 10px 0;
    }
    .showpass input {
      width: auto;
      margin-right: 5px;
    }
    .links {
      margin-top: 15px;
      font-size: 14px;
    }
    .links a {
      color: #fff;
      text-decoration: underline;
      cursor: pointer;
    }
    #message {
      margin-top: 10px;
      font-size: 14px;
      color: #ffdfdf;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <img src="jobsure-logo.jpg" alt="Jobsure">
    </div>
    <h2>Admin Login</h2>
    
    <input type="email" id="email" placeholder="Admin Email" required>
    <input type="password" id="password" placeholder="Password" required>
    
    <div class="showpass">
      <input type="checkbox" onclick="togglePass()"> Show Password
    </div>

    <button onclick="login()">Login</button>

    <div class="links">
      <a onclick="forgotPassword()">Forgot Password?</a>
    </div>

    <p id="message"></p>
  </div>

  <!-- Firebase Authentication Script -->
  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword, sendPasswordResetEmail } 
      from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    window.login = function() {
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value.trim();
      const msg = document.getElementById("message");

      msg.style.color = "white";
      msg.textContent = "⏳ Logging in...";

      signInWithEmailAndPassword(auth, email, pass)
        .then(() => {
          msg.style.color = "#bdfcb9";
          msg.textContent = "✅ Login successful! Redirecting...";
          setTimeout(() => window.location.href = "admin.html", 1200);
        })
        .catch(err => {
          msg.style.color = "#ffbaba";
          msg.textContent = "❌ " + err.message;
        });
    };

    window.forgotPassword = function() {
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("message");

      if (!email) {
        msg.style.color = "#ffbaba";
        msg.textContent = "⚠ Please enter your email address first.";
        return;
      }

      sendPasswordResetEmail(auth, email)
        .then(() => {
          msg.style.color = "#bdfcb9";
          msg.textContent = "📩 Password reset link sent! Check your email.";
        })
        .catch(err => {
          msg.style.color = "#ffbaba";
          msg.textContent = "❌ " + err.message;
        });
    };
  </script>

  <script>
    function togglePass() {
      const p = document.getElementById("password");
      p.type = (p.type === "password") ? "text" : "password";
    }
  </script>

</body>
</html>
