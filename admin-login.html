<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Jobsure</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f9; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .login-box { background:#fff; padding:30px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.1); width:350px; text-align:center; }
    h2 { margin-bottom:20px; color:#004080; }
    input { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; }
    button { width:100%; padding:12px; background:#004080; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer; }
    button:hover { background:#0066cc; }
    .links { margin-top:15px; font-size:14px; }
    .links a { color:#004080; text-decoration:none; margin:0 5px; }
    .showpass { text-align:left; font-size:13px; margin:-5px 0 10px 0; }
    .showpass input { width:auto; margin-right:5px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Enter Admin Email" required />
    
    <label for="password" style="display:block; text-align:left; margin-top:10px;">Password:</label>
    <input type="password" id="password" placeholder="Enter Password" required />
    
    <div class="showpass">
      <input type="checkbox" onclick="togglePass()"> Show Password
    </div>

    <button onclick="login()">Login</button>
    <div class="links">
      <a href="#" onclick="forgotPassword()">Forgot Password?</a>
    </div>
    <p id="message" style="color:red;"></p>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword, sendPasswordResetEmail } 
      from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    window.login = function(){
      const email=document.getElementById("email").value;
      const pass=document.getElementById("password").value;
      const msg=document.getElementById("message");

      signInWithEmailAndPassword(auth,email,pass)
        .then(()=>{ window.location.href="admin.html"; })
        .catch(err=> msg.textContent="❌ "+err.message);
    };

    window.forgotPassword=function(){
      const email=document.getElementById("email").value;
      const msg=document.getElementById("message");
      if(!email){ msg.textContent="⚠ Enter email"; return; }
      sendPasswordResetEmail(auth,email)
        .then(()=>{ msg.style.color="green"; msg.textContent="✔ Reset link sent"; })
        .catch(err=> msg.textContent="❌ "+err.message);
    };
  </script>

  <script>
    function togglePass(){
      const p=document.getElementById("password");
      p.type = (p.type==="password")?"text":"password";
    }
  </script>
</body>
</html>
