<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - Jobsure Automation Training</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #004080;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #004080;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0066cc;
    }
    .links {
      margin-top: 15px;
      font-size: 14px;
    }
    .links a {
      color: #004080;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Admin Login</h2> 
    <input type="text" id="username" placeholder="Enter Username" required />
    <input type="password" id="password" placeholder="Enter Password" required />
    <button onclick="adminLogin()">Login</button>
    <div class="links">
      <a href="#" onclick="forgotPassword()">Forgot Password?</a>
    </div>
    <p id="message" style="color:red;"></p>
  </div>

  <script>
    // 🔑 Admin Credentials (इथे बदलायचे)
    const ADMIN_USERNAME = "Jobsure";
    const ADMIN_PASSWORD = "Jobsure@2025";

    // Admin Login Function
    function adminLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
        // Redirect to admin dashboard
        window.location.href = "admin.html";
      } else {
        message.textContent = "❌ Invalid Username or Password";
      }
    }

    // Forgot Password (Hardcoded Case)
    function forgotPassword() {
      const message = document.getElementById("message");
      message.style.color = "green";
      message.textContent = "ℹ Please contact system admin to reset credentials.";
    }
  </script>

</body>
</html>
