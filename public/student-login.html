<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Portal - Jobsure Automation Training</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-xs sm:max-w-sm text-center">
  
  <h1 class="text-2xl font-semibold text-blue-900 mb-4">Student Portal</h1>

  <img src="/avatar.png" class="w-24 h-24 rounded-full mx-auto mb-4">

  <input 
    type="email" 
    id="email"
    placeholder="Enter Email" 
    class="w-full p-2 border border-gray-300 rounded-md mb-3"
  >

  <input 
    type="password" 
    id="password"
    placeholder="Enter Password" 
    class="w-full p-2 border border-gray-300 rounded-md mb-3"
  >

  <input 
    type="password" 
    id="repassword"
    placeholder="Re-enter Password" 
    class="w-full p-2 border border-gray-300 rounded-md mb-3 hidden"
  >

  <div class="flex items-center text-sm text-gray-700 mb-3">
    <input type="checkbox" id="showPassBox" onclick="togglePass()">
    <label for="showPassBox" class="ml-1">Show Password</label>
  </div>

  <button id="loginBtn" class="w-full bg-blue-900 text-white p-2 rounded-md mb-3 hover:bg-blue-700">
    Login
  </button>

  <button id="signupBtn" class="w-full bg-blue-900 text-white p-2 rounded-md mb-3 hover:bg-blue-700">
    Sign Up
  </button>

  <button id="createBtn" class="w-full bg-blue-900 text-white p-2 rounded-md mb-3 hover:bg-blue-700 hidden">
    Create Account
  </button>

  <label class="block mt-2 text-sm">
    <input type="checkbox" checked> Remember me
  </label>

  <p class="text-sm mb-2">
    <a href="#" onclick="resetPassword()" class="text-blue-600 hover:underline">Forgot password?</a>
  </p>

  <p id="message" class="text-sm mt-2"></p>
</div>


<!-- 🔥 Firebase + Your JS (UNCHANGED) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    sendEmailVerification,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD19JkNIzaO1z7kLcoLD5V4x01-gObCPnA",
    authDomain: "jobsure-115fa.firebaseapp.com",
    projectId: "jobsure-115fa",
    storageBucket: "jobsure-115fa.firebasestorage.app",
    messagingSenderId: "575119834568",
    appId: "1:575119834568:web:75bab1d7d3cb73ec4754fd",
    measurementId: "G-6KTNMMZHG9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const msg = document.getElementById('message');
  const emailInput = document.getElementById('email');
  const passInput = document.getElementById('password');
  const rePassInput = document.getElementById('repassword');
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  const createBtn = document.getElementById('createBtn');

  window.togglePass = function() {
    const type = passInput.type === "password" ? "text" : "password";
    passInput.type = rePassInput.type = type;
  }

  loginBtn.onclick = async () => {
    msg.textContent = "";
    rePassInput.classList.add("hidden");

    try {
      const userCred = await signInWithEmailAndPassword(auth, emailInput.value, passInput.value);
      const user = userCred.user;

      if (!user.emailVerified) {
        msg.className = "text-red-600";
        msg.textContent = "⚠ Please verify your email first!";
        return;
      }

      msg.className = "text-green-600";
      msg.textContent = "✅ Login successful!";
      setTimeout(() => window.location.href = "student-registration.html", 1200);
    } catch (e) {
      msg.className = "text-red-600";
      msg.textContent = "❌ " + e.message;
    }
  };

  signupBtn.onclick = () => {
    rePassInput.classList.remove("hidden");
    loginBtn.classList.add("hidden");
    signupBtn.classList.add("hidden");
    createBtn.classList.remove("hidden");
    msg.className = "text-gray-700";
    msg.textContent = "🆕 Fill details to create account";
  };

  createBtn.onclick = async () => {
    msg.textContent = "";

    if (passInput.value !== rePassInput.value) {
      msg.className = "text-red-600";
      msg.textContent = "⚠ Passwords do not match!";
      return;
    }

    try {
      const userCred = await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value);
      await sendEmailVerification(userCred.user);
      msg.className = "text-green-600";
      msg.textContent = "✅ Account created! Check your email for verification.";

      createBtn.classList.add("hidden");
      loginBtn.classList.remove("hidden");
      signupBtn.classList.remove("hidden");
      rePassInput.classList.add("hidden");
    } catch (e) {
      msg.className = "text-red-600";
      msg.textContent = "❌ " + e.message;
    }
  };

  window.resetPassword = async () => {
    msg.textContent = "";
    if (!emailInput.value) {
      msg.className = "text-red-600";
      msg.textContent = "⚠ Enter your email first!";
      return;
    }

    try {
      await sendPasswordResetEmail(auth, emailInput.value);
      msg.className = "text-green-600";
      msg.textContent = "📩 Password reset email sent!";
    } catch (e) {
      msg.className = "text-red-600";
      msg.textContent = "❌ " + e.message;
    }
  };
</script>

</body>
</html>
