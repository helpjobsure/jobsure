<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard - Jobsure</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f4f6f9; font-family:Arial,sans-serif; margin:0; padding:0; }
.navbar { background:#004080; }
.navbar-brand, .nav-link, .btn-navbar { color:white !important; margin-right:10px; cursor:pointer; }
.navbar-brand { font-weight:bold; }
.container { margin-top:20px; }
h2 { color:#004080; margin-bottom:10px; }
.table { width:100%; border-collapse:collapse; margin-top:10px; }
th,td { border:1px solid #ddd; padding:8px; text-align:left; }
th { background:#004080; color:white; }
tr:nth-child(even){background:#f9f9f9;}
.btn { background:#004080; color:white; border:none; border-radius:5px; padding:5px 10px; margin:2px; cursor:pointer;}
.btn:hover { background:#0066cc; }
.modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; overflow:auto; background:rgba(0,0,0,0.4);}
.modal-content { background:white; margin:10% auto; padding:20px; border-radius:10px; width:90%; max-width:400px;}
.close { float:right; font-size:20px; font-weight:bold; cursor:pointer; }
.toast { position:fixed; bottom:10px; right:10px; background:#004080; color:white; padding:10px 20px; border-radius:5px; opacity:0; transition:opacity 0.5s;}
</style>
</head>
<body>

<!-- Header Bar -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <span class="navbar-brand">Jobsure Dashboard</span>
    <span class="btn-navbar" onclick="window.location.href='registration.html'">Registration</span>
    <span class="btn-navbar" onclick="showSection('profile')">Profile</span>
    <span class="btn-navbar" onclick="showSection('assignments')">Assignments</span>
    <span class="btn-navbar" onclick="showSection('study')">Study Material</span>
    <span class="btn-navbar" onclick="openModal('editModal')">Edit Profile</span>
    <span class="btn-navbar" onclick="openModal('passModal')">Change Password</span>
    <button class="btn ms-auto" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">
  <div id="profileSection"></div>
  <div id="assignmentList"></div>
  <div id="studyList"></div>
</div>

<!-- Modals -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('editModal')">&times;</span>
    <h3>Edit Profile</h3>
    <form id="editForm"></form>
    <button class="btn" onclick="saveEdits()">Save Changes</button>
  </div>
</div>

<div id="passModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('passModal')">&times;</span>
    <h3>Change Password</h3>
    <input type="password" id="newPassword" placeholder="New Password" class="form-control mb-2">
    <input type="password" id="confirmPassword" placeholder="Confirm Password" class="form-control mb-2">
    <button class="btn" onclick="savePassword()">Update Password</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// 🔹 Logged-in student
const loggedInUser = localStorage.getItem("loggedInUser");
const students = JSON.parse(localStorage.getItem("studentsData")) || [];
const currentStudent = students.find(s => s.email===loggedInUser);

if(!currentStudent){ window.location.href="registration.html"; }

// 🔹 Sample assignments & study materials
const assignments = JSON.parse(localStorage.getItem("assignments")) || [];
const studyMaterials = JSON.parse(localStorage.getItem("studyMaterials")) || [];

// 🔹 Toast
function showToast(msg){ 
  const t=document.getElementById("toast");
  t.innerText=msg; t.style.opacity=1;
  setTimeout(()=>t.style.opacity=0,2000);
}

// 🔹 Show/Hide sections
function showSection(section){
  document.getElementById("profileSection").style.display = section==="profile" ? "block" : "none";
  document.getElementById("assignmentList").style.display = section==="assignments" ? "block" : "none";
  document.getElementById("studyList").style.display = section==="study" ? "block" : "none";
}

// 🔹 Display Profile
function displayProfile(){
  let html="<h2>Profile</h2><table class='table'>";
  for(const key in currentStudent){
    if(key!=="password"){
      if(key==="photo") html+=`<tr><th>Photo</th><td><img src='${currentStudent[key]}' width='100'></td></tr>`;
      else if(key==="cv") html+=`<tr><th>CV</th><td><a href='${currentStudent[key]}' target='_blank'>Download</a></td></tr>`;
      else html+=`<tr><th>${key}</th><td>${currentStudent[key]}</td></tr>`;
    }
  }
  html+="</table>";
  document.getElementById("profileSection").innerHTML=html;
  showSection('profile');
}
displayProfile();

// 🔹 Edit Profile Modal
function openModal(id){ document.getElementById(id).style.display="block"; if(id==='editModal') populateEditForm(); }
function closeModal(id){ document.getElementById(id).style.display="none"; }

function populateEditForm(){
  const form=document.getElementById("editForm"); form.innerHTML="";
  for(const key in currentStudent){
    if(key!=="password"){
      form.innerHTML+=`<label>${key}</label><input class="form-control" type='text' id='edit_${key}' value='${currentStudent[key]}'><br>`;
    }
  }
}

function saveEdits(){
  for(const key in currentStudent){
    if(key!=="password"){ currentStudent[key]=document.getElementById(`edit_${key}`).value; }
  }
  localStorage.setItem("studentsData",JSON.stringify(students));
  showToast("Profile updated!");
  displayProfile();
  closeModal('editModal');
}

// 🔹 Change Password
function savePassword(){
  const newPass=document.getElementById("newPassword").value;
  const confirmPass=document.getElementById("confirmPassword").value;
  if(newPass!==confirmPass){ showToast("Passwords do not match!"); return; }
  currentStudent.password=newPass;
  localStorage.setItem("studentsData",JSON.stringify(students));
  showToast("Password updated!");
  closeModal('passModal');
}

// 🔹 Assignments
function displayAssignments(){
  const filtered = assignments.filter(a=>a.course===currentStudent.course);
  if(filtered.length===0) document.getElementById("assignmentList").innerHTML="<p>No assignments found.</p>";
  else{
    let html="<h2>Assignments</h2><table class='table'><tr><th>Title</th><th>Due</th><th>Status</th></tr>";
    filtered.forEach(a=>{ html+=`<tr><td>${a.topic}</td><td>${a.due}</td><td>${a.status}</td></tr>`; });
    html+="</table>";
    document.getElementById("assignmentList").innerHTML=html;
  }
}

// 🔹 Study Materials
function displayStudyMaterials(){
  const filtered = studyMaterials.filter(m=>m.course===currentStudent.course);
  if(filtered.length===0) document.getElementById("studyList").innerHTML="<p>No study materials found.</p>";
  else{
    let html="<h2>Study Material</h2><ul>";
    filtered.forEach(m=>{ html+=`<li>${m.topic} - <a href='${m.link}' target='_blank'>Download/View</a></li>`; });
    html+="</ul>";
    document.getElementById("studyList").innerHTML=html;
  }
}

// 🔹 Logout
function logout(){ localStorage.removeItem("loggedInUser"); window.location.href="registration.html"; }

// 🔹 Close modal on outside click
window.onclick=function(event){
  document.querySelectorAll(".modal").forEach(m=>{ if(event.target==m) m.style.display="none"; });
}

displayAssignments();
displayStudyMaterials();
showSection('profile');
</script>
</body>
</html>
