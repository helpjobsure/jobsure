<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Portal Login — JobSure Automation</title>

  <!-- Tailwind + font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-white">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="logo.jpg" alt="JobSure" class="w-12 h-12 rounded-lg object-cover">
        <div class="text-center">
          <div class="text-lg font-semibold text-blue-900">JobSure Automation</div>
          <div class="text-xs text-gray-500">PLC · SCADA · DCS · HMI</div>
        </div>
      </a>
    </div>
  </header>

  <!-- Centered Card -->
  <main class="min-h-[calc(100vh-120px)] flex items-center justify-center px-4">
    <div class="w-full max-w-md mx-auto">
      <div class="rounded-xl shadow-lg bg-white p-8">
        <!-- Logo & Tagline -->
        <div class="text-center mb-4">
          <img src="avatar.png" alt="JobSure Logo" class="w-16 h-16 mx-auto rounded-md object-cover">
          <h1 class="mt-3 text-2xl font-semibold text-blue-900">Student Portal Login</h1>
          <p class="text-sm text-gray-500 mt-1">Empowering Automation Careers</p>
        </div>

        <!-- Error message (simple red text) -->
        <div id="errorBox" class="text-red-600 text-sm mb-3 hidden"></div>

        <!-- Form -->
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input id="email" type="email" required
                   class="mt-1 w-full border rounded p-3 focus:outline-none focus:ring-2 focus:ring-blue-200"
                   placeholder="you@example.com" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <div class="relative">
              <input id="password" type="password" required
                     class="mt-1 w-full border rounded p-3 focus:outline-none focus:ring-2 focus:ring-blue-200"
                     placeholder="Enter your password" />
              <button type="button" id="togglePwd"
                      class="absolute right-3 top-3 text-sm text-blue-600">Show</button>
            </div>
          </div>

          <div class="flex items-center justify-between text-sm">
            <div class="flex items-center gap-2">
              <input id="remember" type="checkbox" class="h-4 w-4 text-blue-600" />
              <label for="remember" class="text-gray-700">Remember me</label>
            </div>
            <button id="forgotBtn" type="button" class="text-blue-600 hover:underline">Forgot Password?</button>
          </div>

          <!-- Buttons -->
          <div class="space-y-3">
            <button id="loginBtn" type="submit"
                    class="w-full rounded-md px-4 py-2 font-semibold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 flex items-center justify-center gap-3">
              <svg id="spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8h4z"></path>
              </svg>
              <span id="loginBtnText">Login</span>
            </button>

            <button id="googleBtn" type="button"
                    class="w-full rounded-md px-4 py-2 border border-gray-200 flex items-center justify-center gap-3">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="google" />
              Sign in with Google
            </button>
          </div>

          <p class="text-center text-sm mt-2">Don't have an account? <a href="student-registration.html" class="text-blue-600">Create Account</a></p>

          <!-- Resend verification (hidden by default) -->
          <div id="verifySection" class="mt-3 text-sm text-gray-700 hidden">
            <div id="verifyMsg" class="text-gray-700 mb-2"></div>
            <button id="resendBtn" type="button" class="text-sm text-blue-600 hover:underline">Resend Verification Email</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-sm text-gray-600">
    © 2025 JobSure Automation Training
  </footer>

  <!-- Firebase Auth logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      sendPasswordResetEmail,
      sendEmailVerification,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    // Firebase config (your project)
    const firebaseConfig = {
      apiKey: "AIzaSyD19JkNIzaO1z7kLcoLD5V4x01-gObCPnA",
      authDomain: "jobsure-115fa.firebaseapp.com",
      projectId: "jobsure-115fa",
      storageBucket: "jobsure-115fa.firebasestorage.app",
      messagingSenderId: "575119834568",
      appId: "1:575119834568:web:75bab1d7d3cb73ec4754fd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Elements
    const loginForm = document.getElementById('loginForm');
    const emailEl = document.getElementById('email');
    const pwdEl = document.getElementById('password');
    const errorBox = document.getElementById('errorBox');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');
    const spinner = document.getElementById('spinner');
    const togglePwd = document.getElementById('togglePwd');
    const googleBtn = document.getElementById('googleBtn');
    const forgotBtn = document.getElementById('forgotBtn');
    const verifySection = document.getElementById('verifySection');
    const verifyMsg = document.getElementById('verifyMsg');
    const resendBtn = document.getElementById('resendBtn');

    // Simple helper to show simple red error text (clean)
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }
    function hideError() {
      errorBox.textContent = '';
      errorBox.classList.add('hidden');
    }

    // Loader toggle
    function setLoading(isLoading) {
      if (isLoading) {
        spinner.classList.remove('hidden');
        loginBtnText.textContent = 'Please wait...';
        loginBtn.disabled = true;
      } else {
        spinner.classList.add('hidden');
        loginBtnText.textContent = 'Login';
        loginBtn.disabled = false;
      }
    }

    // Map Firebase errors to simple red text (clean)
    function friendlyError(code) {
      switch (code) {
        case 'auth/wrong-password': return 'Incorrect password';
        case 'auth/user-not-found': return 'No account found with this email';
        case 'auth/invalid-email': return 'Enter a valid email';
        case 'auth/too-many-requests': return 'Too many attempts. Try again later';
        default: return 'Login failed';
      }
    }

    // Toggle password show/hide
    togglePwd.addEventListener('click', () => {
      if (pwdEl.type === 'password') { pwdEl.type = 'text'; togglePwd.textContent = 'Hide'; }
      else { pwdEl.type = 'password'; togglePwd.textContent = 'Show'; }
    });

    // Forgot password flow
    forgotBtn.addEventListener('click', async () => {
      hideError();
      const email = emailEl.value.trim();
      if (!email) { showError('Please enter your email to reset password'); return; }
      setLoading(true);
      try {
        await sendPasswordResetEmail(auth, email);
        showError('Password reset email sent. Check your inbox.');
      } catch (err) {
        showError(friendlyError(err.code || '') || 'Failed to send reset email');
      } finally {
        setLoading(false);
      }
    });

    // Login submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      verifySection.classList.add('hidden');

      const email = emailEl.value.trim();
      const password = pwdEl.value;

      if (!email || !password) { showError('Please fill required fields'); return; }

      setLoading(true);
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Check email verification
        if (user.emailVerified) {
          // Redirect to student dashboard
          window.location.href = 'student.html';
        } else {
          // Not verified — show professional message (Option B)
          showError('Your email is not verified. Please check your inbox and verify your account.');
          verifyMsg.textContent = 'Your email is not verified.';
          verifySection.classList.remove('hidden');

          // keep user signed in for resend action (we will sign out after sending)
        }
      } catch (err) {
        // Show simple red error text
        showError(friendlyError(err.code || ''));
      } finally {
        setLoading(false);
      }
    });

    // Resend verification email (attempts to resend to the signed-in user)
    resendBtn.addEventListener('click', async () => {
      hideError();
      setLoading(true);
      try {
        // The current user might not be available (signed-out). We'll sign in silently using the entered credentials.
        const email = emailEl.value.trim();
        const password = pwdEl.value;
        if (!email || !password) {
          showError('Enter email & password above to resend verification');
          setLoading(false);
          return;
        }

        // Sign in to get the user object then send verification
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        if (user.emailVerified) {
          showError('Email is already verified. Redirecting...');
          // sign out then redirect
          await signOut(auth);
          window.location.href = 'student.html';
          return;
        }

        await sendEmailVerification(user);
        showError('Verification link sent again. Please check your email.');
        // sign out the temporary session so user must verify before login
        await signOut(auth);
      } catch (err) {
        showError('Failed to resend verification. Try again.');
      } finally {
        setLoading(false);
      }
    });

    // Google Sign-In
    googleBtn.addEventListener('click', async () => {
      hideError();
      setLoading(true);
      try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        // Google accounts are considered verified by default
        if (user.emailVerified) {
          window.location.href = 'student.html';
        } else {
          // unlikely for Google, but handle gracefully
          showError('Your email is not verified. Please verify your Google account email.');
        }
      } catch (err) {
        showError('Login failed');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
