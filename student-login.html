<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
      width: 400px;
      margin-bottom: 20px;
    }
    h2, h1 {
      text-align: center;
    }
    input[type=text], input[type=password], input[type=email] {
      width: 100%;
      padding: 12px;
      margin: 5px 0 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background-color: #0056b3; }
    .cancelbtn { background-color: red; }
    .clearfix::after { content: ""; clear: both; display: table; }
    .psw { float: right; margin-top: 10px; }
    .show-password { margin-bottom: 15px; }
    .switch-link { text-align: center; margin-top: 15px; }
    .switch-link a { color: dodgerblue; text-decoration: none; cursor: pointer; }
    .switch-link a:hover { text-decoration: underline; }
    .imgcontainer { text-align: center; margin: 15px 0; }
    .imgcontainer img.avatar { width: 80px; border-radius: 50%; }
  </style>
</head>
<body>

<!-- Student Login Form -->
<div class="container" id="loginForm">
  <h2>Student Login</h2>
  <div class="imgcontainer">
    <img src="img_avatar2.png" alt="Avatar" class="avatar">
  </div>

  <label for="uname"><b>Username</b></label>
  <input type="text" placeholder="Enter Username" id="uname" required>

  <label for="psw"><b>Password</b></label>
  <input type="password" placeholder="Enter Password" id="psw" required>

  <div class="show-password">
    <input type="checkbox" onclick="togglePassword()"> Show Password
  </div>

  <button onclick="studentLogin()">Login</button>
  <div class="psw">Forgot <a href="#" onclick="forgotPassword()">password?</a></div>

  <div class="switch-link">
    <p>Don't have an account? <a onclick="showSignUp()">Sign in </a></p>
  </div>
</div>

<!-- Sign Up Form -->
<div class="container" id="signupForm" style="display:none;">
  <h1>Sign Up</h1>
  <p>Please fill in this form to create an account.</p>
  <hr>

  <label for="email"><b>Email</b></label>
  <input type="email" placeholder="Enter Email" id="email" required>

  <label for="psw-signup"><b>Password</b></label>
  <input type="password" placeholder="Enter Password" id="psw-signup" required>

  <label for="psw-repeat"><b>Repeat Password</b></label>
  <input type="password" placeholder="Repeat Password" id="psw-repeat" required>

  <label>
    <input type="checkbox" checked="checked" name="remember" style="margin-bottom:15px"> Remember me
  </label>

  <p>By creating an account you agree to our <a href="#" style="color:dodgerblue">Terms & Privacy</a>.</p>

  <div class="clearfix">
    <button type="button" class="cancelbtn" onclick="showLogin()">Cancel</button>
    <button type="button" class="signupbtn" onclick="studentSignUp()">Sign Up</button>
  </div>
</div>

<script>
  // Toggle Password
  function togglePassword() {
    const psw = document.getElementById("psw");
    psw.type = (psw.type === "password") ? "text" : "password";
  }

  // Show Sign Up Form
  function showSignUp() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "block";
  }

  // Show Login Form
  function showLogin() {
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
  }

  // Forgot Password
  function forgotPassword() {
    alert("Forgot password? Please contact support or reset via email.");
  }

  // Student Login
  function studentLogin() {
    const user = document.getElementById("uname").value.trim();
    const pass = document.getElementById("psw").value.trim();

    // Demo: For now accept any non-empty credentials
    if(user && pass) {
      localStorage.setItem("studentUser", user);
      alert("Login Successful ✅");
      window.location.href = "student.html";
    } else {
      alert("Please enter valid credentials ❌");
    }
  }

  // Student Sign Up
  function studentSignUp() {
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("psw-signup").value.trim();
    const repass = document.getElementById("psw-repeat").value.trim();

    if(!email || !pass || !repass) {
      alert("All fields are required ❌");
      return;
    }
    if(pass !== repass) {
      alert("Passwords do not match ❌");
      return;
    }

    // Save in localStorage (demo)
    localStorage.setItem(email, pass);
    alert("Sign Up Successful 🎉 Please login now");
    showLogin();
  }
</script>

</body>
</html>
