<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login - Jobsure</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background:#f4f6f9; 
      display:flex; 
      justify-content:center; 
      align-items:center; 
      height:100vh; 
      margin:0; 
    }
    .login-box { 
      background:#fff; 
      padding:30px; 
      border-radius:8px; 
      box-shadow:0 4px 10px rgba(0,0,0,0.1); 
      width:350px; 
      text-align:center; 
    }
    h2 { margin-bottom:20px; color:#004080; }
    input { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; }
    button { width:100%; padding:12px; background:#004080; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer; }
    button:hover { background:#0066cc; }
    .links { margin-top:15px; font-size:14px; }
    .links a { color:#004080; text-decoration:none; margin:0 5px; }
    .showpass { 
      text-align:left; 
      font-size:13px; 
      margin-top:-5px; 
      margin-bottom:10px; 
    }
    .showpass label {
      cursor:pointer;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Student Login</h2>
    <input type="email" id="email" placeholder="Enter Email" required />
    
    <input type="password" id="password" placeholder="Enter Password" required />
    <!-- ⬇ Checkbox directly below password input -->
    <div class="showpass">
      <label><input type="checkbox" onclick="togglePass()"> Show Password</label>
    </div>

    <button onclick="login()">Login</button>
    <div class="links">
      <a href="#" onclick="signup()">Sign Up</a> | 
      <a href="#" onclick="forgotPassword()">Forgot Password?</a>
    </div>
    <p id="message" style="color:red;"></p>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { auth, db } from "./firebase.js";
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } 
      from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    // Login
    window.login = function(){
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      signInWithEmailAndPassword(auth, email, password)
        .then(() => window.location.href="student.html")
        .catch(err => message.textContent = "❌ "+err.message);
    };

    // Signup
    window.signup = function(){
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      createUserWithEmailAndPassword(auth, email, password)
        .then(async userCred=>{
          await setDoc(doc(db,"students",userCred.user.uid), { email: email });
          message.style.color="green";
          message.textContent="✔ Account Created! Now Login.";
        })
        .catch(err => message.textContent = "❌ "+err.message);
    };

    // Forgot Password
    window.forgotPassword = function(){
      const email = document.getElementById("email").value;
      const message = document.getElementById("message");
      if(!email){ message.textContent="⚠ Enter your email first."; return; }
      sendPasswordResetEmail(auth, email)
        .then(()=>{ message.style.color="green"; message.textContent="✔ Reset link sent to email."; })
        .catch(err => message.textContent="❌ "+err.message);
    };
  </script>

  <script>
    function togglePass(){
      const p=document.getElementById("password");
      p.type = (p.type==="password")?"text":"password";
    }
  </script>

</body>
</html>
