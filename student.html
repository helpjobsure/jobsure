<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Dashboard — JobSure</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-4xl mx-auto p-6">
    <div class="bg-white p-4 rounded shadow">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold">Student Dashboard</h2>
        <button id="signOut" class="bg-red-500 text-white px-3 py-1 rounded">Sign out</button>
      </div>
      <div id="profile" class="mt-4"></div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const profile = document.getElementById('profile');
    const signOutBtn = document.getElementById('signOut');

    onAuthStateChanged(auth, async (u) => {
      if (!u) return window.location.href = 'student-login.html';
      const snap = await getDoc(doc(db, 'students', u.uid));
      const data = snap.exists() ? snap.data() : null;
      profile.innerHTML = data ? `
        <div class="flex gap-4 items-center">
          <img src="${'${data.photo}'}" class="w-24 h-24 rounded object-cover" />
          <div>
            <div class="font-semibold text-lg">${'${data.name}'}</div>
            <div class="text-sm text-slate-600">${'${data.email}'}</div>
            <div class="mt-1">Status: <strong>${'${data.status||"Pending"}'}</strong></div>
            <div class="mt-2"><a href="${'${data.cv||"#"}'}" target="_blank" class="text-blue-600">Download CV</a></div>
          </div>
        </div>
      ` : '<p>No registration found. Please complete registration.</p>';
    });

    signOutBtn.addEventListener('click', async ()=>{
      await signOut(auth);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
